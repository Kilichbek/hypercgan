name: hypercgan
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.7
  - numpy<2
  - pip:
      - click
      - ftfy
      - ninja          # builds the custom CUDA kernels (requires the CUDA toolkit / nvcc)
      - omegaconf
      - pillow
      - psutil
      - regex
      - requests
      - scipy
      - tensorboard
      - tqdm
      - git+https://github.com/openai/CLIP.git
